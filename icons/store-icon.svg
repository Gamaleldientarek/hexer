<!--
  Chrome Web Store icon.

  Distinct from icons/icon.svg, which is the toolbar icon and correctly fills
  its frame. The store icon follows different rules:
    - 128x128 canvas, artwork 96x96, 16px transparent padding on every side
    - no edge at the canvas boundary, because the store UI adds its own
    - must read on light and dark backgrounds, hence the faint light ring
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 96x96 tile, inset 16px -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="#141414"/>
  <!-- Subtle outer ring so the dark tile keeps its shape on dark backgrounds -->
  <rect x="16.5" y="16.5" width="95" height="95" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Four samples: the palette, and the product's whole idea -->
  <rect x="31" y="31" width="30" height="30" rx="7" fill="#F83200"/>
  <rect x="67" y="31" width="30" height="30" rx="7" fill="#FFFFFF"/>
  <rect x="31" y="67" width="30" height="30" rx="7" fill="#8B8B8B"/>
  <rect x="67" y="67" width="30" height="30" rx="7" fill="#3A3A3A"/>
</svg>
